name: Drop Approvals on Large Commits

on:
  pull_request:
    types: [synchronize]

permissions:
  contents: read
  pull-requests: write

jobs:
  drop-approvals:
    runs-on: ubuntu-latest
    steps:
      - name: Dismiss approvals after large pushes
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.event.after }}
        run: |
          lines=$(gh api "/repos/$GITHUB_REPOSITORY/compare/$BEFORE...$AFTER" --jq '[.files[].changes] | add // 0')
          echo "Lines changed in this push: $lines"

          [ "$lines" -lt 3 ] && exit 0

          gh api "/repos/$GITHUB_REPOSITORY/pulls/$PR/reviews" --jq '.[] | select(.state == "APPROVED") | .id' |
            while read -r review; do
              gh api --method PUT \
                "/repos/$GITHUB_REPOSITORY/pulls/$PR/reviews/$review/dismissals" \
                -f message="Automatically dismissed: new push contained 3 or more lines of changes."
            done
