name: Drop Approvals on Large Commits

on:
  pull_request:
    types: [synchronize] # Only runs when new commits are pushed to the PR branch

jobs:
  check-and-dismiss:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write # Required to dismiss PR reviews
      contents: read       # Required to checkout the code

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Fetches all history so we can compare the old and new commit SHAs

      - name: Check commit size and dismiss approvals
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.event.after }}
        run: |
          # 1. Calculate total lines changed (additions + deletions) in the new push
          LINES_CHANGED=$(git diff --numstat $BEFORE_SHA $AFTER_SHA | awk '{s+=$1+$2} END {print s}')
          
          # Handle empty output if there are no text changes (e.g., file permission changes)
          LINES_CHANGED=${LINES_CHANGED:-0}
          
          echo "Lines changed in this push: $LINES_CHANGED"

          # 2. Check if the lines changed are 3 or more
          if [ "$LINES_CHANGED" -ge 3 ]; then
            echo "Change is >= 3 lines. Checking for approvals to dismiss..."

            # 3. Get all approved review IDs for this PR using the GitHub CLI
            REVIEWS=$(gh api repos/${{ github.repository }}/pulls/$PR_NUMBER/reviews \
              --jq '.[] | select(.state == "APPROVED") | .id')

            if [ -z "$REVIEWS" ]; then
              echo "No approved reviews found. Nothing to dismiss."
            else
              # 4. Loop through each approved review and dismiss it
              for REVIEW_ID in $REVIEWS; do
                echo "Dismissing review ID: $REVIEW_ID"
                gh api \
                  --method PUT \
                  -H "Accept: application/vnd.github+json" \
                  /repos/${{ github.repository }}/pulls/$PR_NUMBER/reviews/$REVIEW_ID/dismissals \
                  -f message="Automatically dismissed: New push contained 3 or more lines of changes."
              done
            fi
          else
            echo "Change is strictly less than 3 lines. Keeping current approvals intact."
          fi
