name: PR Approval Retention

on:
  pull_request:
    types: [synchronize]

concurrency:
  group: pr-approval-retention-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  pr-approval-retention:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install script dependencies
        run: bun add @langchain/langgraph @langchain/openrouter axios zod

      - name: Run PR approval retention script
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_PR_NUMBER: ${{ github.event.pull_request.number }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: bun .github/scripts/pr-approval-retention.script.js
